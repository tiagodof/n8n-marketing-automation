services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-marketing
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=Europe/Lisbon
      - TZ=Europe/Lisbon
      # n8n can only read the generated report files, never the project source.
      - N8N_RESTRICT_FILE_ACCESS_TO=/reports
      # Internal-only connection to the reporting service.
      - REPORTING_SERVICE_URL=http://reporting-service:8080
      - REPORTING_SERVICE_TOKEN=${REPORTING_SERVICE_TOKEN}
      # Used by the workflow expressions and SMTP email configuration.
      - SMTP_USER=${SMTP_USER}
      - REPORT_RECIPIENT_EMAIL=${REPORT_RECIPIENT_EMAIL}
    volumes:
      - n8n_data:/home/node/.n8n
      - reports_data:/reports:ro
      - ../modules/01-reporting-agent/workflows:/home/node/workflows:ro
    depends_on:
      reporting-service:
        condition: service_healthy
    networks:
      - n8n_network

  reporting-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.reporting-service
    container_name: marketing-reporting-service
    restart: unless-stopped
    environment:
      - REPORT_OUTPUT_DIR=/reports
      - REPORTING_SERVICE_TOKEN=${REPORTING_SERVICE_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.openai.com/v1}
      - GA4_PROPERTY_ID=${GA4_PROPERTY_ID}
      - GOOGLE_SERVICE_ACCOUNT_KEY=${GOOGLE_SERVICE_ACCOUNT_KEY}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_AD_ACCOUNT_ID=${META_AD_ACCOUNT_ID}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      - LINKEDIN_AD_ACCOUNT_ID=${LINKEDIN_AD_ACCOUNT_ID}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202608}
      - LINKEDIN_CAMPAIGN_NAMES=${LINKEDIN_CAMPAIGN_NAMES:-{}}
    volumes:
      - reports_data:/reports
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - n8n_network

volumes:
  n8n_data:
  reports_data:

networks:
  n8n_network:
    driver: bridge
